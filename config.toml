base_url = "https://tlyeung.com/"
title = "TL Yeung"
description = "Personal website of TL Yeung."
default_language = "en"

generate_feeds = true

# Hugo used `tag` -> `tags`; Zola keeps the plural name so URLs stay /tags/<name>/.
taxonomies = [
  { name = "tags", feed = true },
]

# Emoji shown before each tag on the live site.
[extra.tag_emojis]
love = "💕"
math = "🧮"
travel = "🛫"
football = "⚽"
do-not = "❌"